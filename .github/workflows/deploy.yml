name: Deploy IntonixUB to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Prepare Lambda package
        run: |
          mkdir -p bundle
          # Copy dist if standard build, or .output/public for Nitro
          if [ -d "dist" ]; then
            cp -r dist bundle/
          elif [ -d ".output/public" ]; then
            cp -r .output/public bundle/dist
          fi
          cp index.mjs bundle/
          cd bundle
          zip -r ../deploy-package.zip .

      - name: Deploy to AWS Lambda
        uses: appleboy/lambda-action@v0.2.0
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: us-east-2
          function_name: intonix-mirror
          zip_file: deploy-package.zip
