name: Deploy IntonixUB to AWS Lambda

on:
  push:
    branches:
      - main # Or your default branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Prepare Lambda package
        run: |
          mkdir -p bundle
          cp -r dist bundle/
          cp index.mjs bundle/
          cd bundle
          zip -r ../deploy-package.zip .

      - name: Deploy to AWS Lambda
        uses: appleboy/lambda-action@v0.2.0
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: us-east-2 # Change to your AWS region if different
          function_name: intonix-mirror # Must match your Lambda function name exactly
          zip_file: deploy-package.zip
